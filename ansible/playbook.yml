---
- name: Deploy MERN RTK Full-Stack Application
  hosts: webservers
  become: yes
  gather_facts: yes

  tasks:
    - name: Update package caches
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required system tools (Nginx, Git, Curl)
      apt:
        name:
          - nginx
          - git
          - curl
        state: present

    - name: Setup Node.js 20.x repository
      shell: "curl -fsSL https://deb.nodesource.com/setup_20.x | bash -"

    - name: Install Node.js
      apt:
        name: nodejs
        state: present

    - name: Install PM2 globally (Process Manager)
      npm:
        name: pm2
        global: yes

    # --- SERVER SETUP ---
    - name: Create application directory for Express backend
      file:
        path: /var/www/server
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Deploy backend server files
      copy:
        src: files/server/
        dest: /var/www/server/
        owner: ubuntu
        group: ubuntu

    - name: Install backend npm dependencies
      npm:
        path: /var/www/server

    - name: Start or restart Express backend with PM2
      shell: pm2 restart all --update-env || pm2 start server.js --name "rtk-backend"
      args:
        chdir: /var/www/server
      become_user: ubuntu

    # --- FRONTEND SETUP ---
    - name: Ensure Nginx web root directory exists
      file:
        path: /var/www/html
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Deploy compiled React frontend build to Nginx
      copy:
        src: files/client-dist/
        dest: /var/www/html/
        owner: www-data
        group: www-data
        mode: '0755'

    # --- NGINX REVERSE PROXY CONFIGURATION ---
    - name: Configure Nginx as Reverse Proxy for React & Express API
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              root /var/www/html;
              index index.html;

              server_name _;

              # Serves React Frontend (SPA Fallback)
              location / {
                  try_files $uri $uri/ /index.html;
              }

              # Proxies API traffic to Node.js Express server on Port 5000
              location /api/ {
                  proxy_pass http://localhost:5000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
          }
        owner: root
        group: root
        mode: '0644'

    - name: Test and restart Nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes
