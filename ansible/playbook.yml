---
- name: Configure Web Server with Nginx
  hosts: webservers
  become: yes
  gather_facts: yes

  tasks:
    - name: Update APT package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Nginx web server
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx service is running and enabled on boot
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy custom web application homepage
      copy:
        src: files/index.html
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart Nginx to apply changes
      systemd:
        name: nginx
        state: restarted
